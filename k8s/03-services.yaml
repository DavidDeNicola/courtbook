apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: courtbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      enableServiceLinks: false
      containers:
        - name: booking-service
          image: courtbook-booking:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://booking-db:5432/booking_db
            - name: SPRING_DATASOURCE_USERNAME
              value: courtbook
            - name: SPRING_DATASOURCE_PASSWORD
              value: courtbook
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: courtbook
spec:
  selector:
    app: booking-service
  ports:
    - port: 8081
      targetPort: 8081
---
