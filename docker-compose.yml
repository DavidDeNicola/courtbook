services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: courtbook-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: courtbook-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courtbook
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  booking-db:
    image: postgres:18-alpine
    container_name: courtbook-booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: courtbook
      POSTGRES_PASSWORD: courtbook
    ports:
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U courtbook -d booking_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  availability-db:
    image: postgres:18-alpine
    container_name: courtbook-availability-db
    environment:
      POSTGRES_DB: availability_db
      POSTGRES_USER: courtbook
      POSTGRES_PASSWORD: courtbook
    ports:
      - "5434:5432"
    volumes:
      - availability-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U courtbook -d availability_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:18-alpine
    container_name: courtbook-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: courtbook
      POSTGRES_PASSWORD: courtbook
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U courtbook -d notification_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-service:
    build: ./booking-service
    image: courtbook-booking
    container_name: courtbook-booking-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking_db
      SPRING_DATASOURCE_USERNAME: courtbook
      SPRING_DATASOURCE_PASSWORD: courtbook
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_started

  availability-service:
    build: ./availability-service
    image: courtbook-availability
    container_name: courtbook-availability-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://availability-db:5432/availability_db
      SPRING_DATASOURCE_USERNAME: courtbook
      SPRING_DATASOURCE_PASSWORD: courtbook
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      availability-db:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build: ./notification-service
    image: courtbook-notification
    container_name: courtbook-notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: courtbook
      SPRING_DATASOURCE_PASSWORD: courtbook
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  booking-db-data:
  availability-db-data:
  notification-db-data: